manifest_version: 1
esim_version: "2.x"
dependencies:
  - id: python
    name: Python
    category: runtime
    required: true
    version:
      minimum: "3.10"
      recommended: "3.14"
      maximum: null
      excluded: []
      tested: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    platforms:
      windows:
        supported: true
      linux:
        supported: true
    detection:
      method: all
      executable: python
      python_package: pip
      version_args:
        - "--version"
      known_paths:
        windows:
          - "%LOCALAPPDATA%\\Programs\\Python"
          - "%ProgramFiles%\\Python"
        linux:
          - "/usr/bin/python3"
          - "/usr/local/bin/python3"
    package_manager:
      winget: Python.Python.3.14
      apt: python3

  - id: ngspice
    name: Ngspice
    category: simulator
    required: true
    version:
      minimum: null
      recommended: null
      maximum: null
      excluded: []
      tested: []
    platforms:
      windows:
        supported: true
      linux:
        supported: true
    detection:
      method: executable
      executable: ngspice
      version_args:
        - "--version"
      known_paths:
        windows:
          - "%ProgramFiles%\\Spice64"
          - "%ProgramFiles(x86)%\\Spice64"
        linux:
          - "/usr/bin/ngspice"
    package_manager:
      apt: ngspice
      choco: ngspice
    installation:
      manual_url: https://ngspice.sourceforge.io/download.html
      notes: >-
        Not listed in the default winget catalog. Windows users can use the
        Chocolatey ngspice package or download the official portable 7z bundle
        from the ngspice download page and add its bin directory to PATH.

  - id: kicad
    name: KiCad
    category: pcb
    required: true
    version:
      minimum: null
      recommended: null
      maximum: null
      excluded: []
      tested: []
    platforms:
      windows:
        supported: true
      linux:
        supported: true
    detection:
      method: executable
      executable: kicad
      version_args:
        - "--version"
      known_paths:
        windows:
          - "%ProgramFiles%\\KiCad"
          - "%LOCALAPPDATA%\\Programs\\KiCad"
        linux:
          - "/usr/bin/kicad"
    package_manager:
      winget: KiCad.KiCad
      apt: kicad
